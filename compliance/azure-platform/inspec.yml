name: azure-platform
title: Flagpost Azure platform baseline
maintainer: Shubham Khedkar
copyright: Shubham Khedkar
license: MIT
summary: >
  Verifies the deployed AKS, ACR, Key Vault, network and monitoring resources match the
  guardrails declared in Terraform. Runs post-deploy from Azure Pipelines (inspec-azure).
version: 1.0.0
inspec_version: ">= 5.0"
supports:
  - platform: azure
depends:
  - name: inspec-azure
    url: https://github.com/inspec/inspec-azure/archive/refs/tags/v1.118.47.tar.gz
inputs:
  - name: resource_group
    type: String
    value: rg-flagpost-prod
  - name: aks_name
    type: String
    value: aks-flagpost-prod
  - name: acr_name
    type: String
    value: acrflagpostprodsk07
  - name: key_vault_name
    type: String
    value: kv-flagpost-prod-sk07
  - name: vnet_name
    type: String
    value: vnet-flagpost-prod
  - name: log_analytics_name
    type: String
    value: log-flagpost-prod
