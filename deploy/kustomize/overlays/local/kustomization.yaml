apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flagpost
resources:
  - ../../base
patches:
  # kind has no Secrets Store CSI driver; scripts/kind-smoke.sh creates the
  # flagpost-api-key Secret with a random token and it is mounted at the same path.
  - target:
      kind: Deployment
      name: flagpost
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1
        value:
          name: secrets-store
          secret:
            secretName: flagpost-api-key
            defaultMode: 0440
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: local-kind
