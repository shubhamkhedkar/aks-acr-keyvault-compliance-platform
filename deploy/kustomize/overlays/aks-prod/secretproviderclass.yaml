# Azure Key Vault provider for the Secrets Store CSI driver (AKS add-on).
# Authenticates with Workload Identity: no client secret, no pod-managed identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: flagpost-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "00000000-0000-0000-0000-000000000000"   # terraform output workload_identity_client_id
    keyvaultName: "kv-flagpost-prod-sk07"              # terraform output key_vault_name
    tenantId: "00000000-0000-0000-0000-000000000000"   # terraform output tenant_id
    cloudName: AzurePublicCloud
    objects: |
      array:
        - |
          objectName: flagpost-api-key
          objectType: secret
          objectAlias: flagpost-api-key
