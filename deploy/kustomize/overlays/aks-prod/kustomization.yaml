apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flagpost
resources:
  - ../../base
  - secretproviderclass.yaml
images:
  # The pipeline pins the digest it just pushed:
  #   kustomize edit set image flagpost=<acr>.azurecr.io/flagpost@sha256:<digest>
  - name: flagpost
    newName: acrflagpostprodsk07.azurecr.io/flagpost
    newTag: 1.0.0
patches:
  - path: deployment-patch.yaml
  - path: serviceaccount-patch.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: flagpost
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
