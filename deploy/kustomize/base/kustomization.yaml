apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flagpost
labels:
  - pairs:
      app.kubernetes.io/name: flagpost
      app.kubernetes.io/part-of: aks-acr-keyvault-compliance-platform
    includeSelectors: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - hpa.yaml
configMapGenerator:
  - name: flagpost-seed
    files:
      - flags.json
images:
  - name: flagpost
    newName: flagpost
    newTag: local
