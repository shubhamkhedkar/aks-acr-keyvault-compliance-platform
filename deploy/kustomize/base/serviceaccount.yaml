apiVersion: v1
kind: ServiceAccount
metadata:
  name: flagpost
  annotations:
    # Replaced per environment with the user-assigned identity client ID (terraform output
    # workload_identity_client_id). The federated credential pins system:serviceaccount:flagpost:flagpost.
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
automountServiceAccountToken: false
