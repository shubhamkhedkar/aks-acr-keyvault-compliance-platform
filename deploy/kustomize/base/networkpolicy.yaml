# Default deny for the namespace, then allow only what Flagpost needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flagpost-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              flagpost.io/client: "true"
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
---
# DNS only. Key Vault is read by the CSI driver on the node, not by the app pod,
# so the pod needs no egress to Key Vault or Entra ID.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flagpost-egress-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
