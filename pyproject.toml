[project]
name = "flagpost"
version = "1.0.0"
description = "Feature-flag evaluation service for the AKS + ACR + Key Vault platform"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["app/tests", "tests"]
pythonpath = ["app/src", "."]
addopts = "-q --strict-markers --cov=flagpost --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["*/gunicorn_conf.py", "*/wsgi.py"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S104"]

[tool.ruff.lint.isort]
known-first-party = ["flagpost", "scripts"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603"]  # fixed argv lists, no shell; inputs are validated before use
"app/tests/*" = ["S101", "S105", "S106"]
"tests/*" = ["S101", "S603", "S607"]
