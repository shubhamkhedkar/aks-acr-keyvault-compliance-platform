# Terraform with the ARM service connection's federated credential (ARM_USE_OIDC):
# no client secret exists anywhere. `plan` publishes the binary plan; `apply` applies
# exactly that plan after the environment approval.
parameters:
  - name: serviceConnection
    type: string
  - name: workingDirectory
    type: string
  - name: command
    type: string
    values: [plan, apply]

steps:
  - ${{ if eq(parameters.command, 'plan') }}:
      - checkout: self
  - task: AzureCLI@2
    displayName: terraform ${{ parameters.command }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: ${{ parameters.workingDirectory }}
      inlineScript: |
        set -euo pipefail
        export ARM_USE_OIDC=true ARM_USE_AZUREAD=true
        export ARM_CLIENT_ID="$servicePrincipalId" ARM_TENANT_ID="$tenantId" ARM_OIDC_TOKEN="$idToken"
        export TF_IN_AUTOMATION=true TF_INPUT=false
        terraform init \
          -backend-config="resource_group_name=rg-flagpost-tfstate" \
          -backend-config="storage_account_name=$(TF_STATE_STORAGE_ACCOUNT)" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=prod/platform.tfstate" \
          -backend-config="use_azuread_auth=true"
        if [ "${{ parameters.command }}" = "plan" ]; then
          terraform plan -var-file=prod.tfvars -var="subscription_id=$(az account show --query id -o tsv)" \
            -out=tfplan -lock-timeout=5m
          terraform show -no-color tfplan > tfplan.txt
          mkdir -p "$(Build.ArtifactStagingDirectory)/tfplan"
          cp tfplan tfplan.txt .terraform.lock.hcl "$(Build.ArtifactStagingDirectory)/tfplan/"
        else
          cp "$(Pipeline.Workspace)/tfplan/tfplan" .
          terraform apply -lock-timeout=5m tfplan
        fi
  - ${{ if eq(parameters.command, 'plan') }}:
      - publish: $(Build.ArtifactStagingDirectory)/tfplan
        artifact: tfplan
